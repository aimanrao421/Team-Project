<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login</title>
	<style>
		:root{--bg:#f3f6fb;--card:#fff;--accent:#2563eb;--muted:#6b7280}
		*{box-sizing:border-box}
		body{margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;height:100vh}
		.card{width:340px;background:var(--card);padding:28px;border-radius:12px;box-shadow:0 6px 24px rgba(16,24,40,0.08)}
		h1{margin:0 0 18px;font-size:20px}
		label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
		input[type="email"],input[type="password"],input[type="text"]{width:100%;padding:10px 12px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px}
		.password-row{position:relative}
		.toggle-password{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;padding:6px;border-radius:6px;cursor:pointer;display:flex;align-items:center}
		.toggle-password:focus{outline:2px solid rgba(37,99,235,0.2)}
		.btn{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:0;padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer}
		.help{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
		.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
	</style>
</head>
<body>
	<main class="card" role="main">
		<form id="loginForm" action="#" novalidate>
			<h1>Sign in</h1>

			<label for="email">Email</label>
			<input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">

			<label for="password">Password</label>
			<div class="password-row">
				<input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password" minlength="4">
				<button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false">
					<svg id="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
						<circle cx="12" cy="12" r="3" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			</div>

			<button type="submit" class="btn">Log in</button>
			<div class="help">Need an account? Contact your admin.</div>
		</form>
	</main>

	<script>
		(function(){
			const pw = document.getElementById('password');
			const toggle = document.getElementById('togglePassword');
			const icon = document.getElementById('icon');

			function setIcon(show){
				if(show){
					icon.innerHTML = '<path d="M3 3l18 18" stroke="#374151" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.58 10.58A3 3 0 0 0 13.42 13.42" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>';
				} else {
					icon.innerHTML = '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>';
				}
			}

			toggle.addEventListener('click', function(){
				const showing = pw.type === 'text';
				pw.type = showing ? 'password' : 'text';
				toggle.setAttribute('aria-pressed', String(!showing));
				toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
				setIcon(!showing);
			});

			// initialize icon state
			setIcon(false);
		})();
	</script>
</body>
</html>
