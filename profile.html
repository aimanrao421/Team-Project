<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .container {
      max-width: 400px;
      margin: auto;
      border: 1px solid #ddd;
      min-height: 100vh;
    }

    /* Header */
    .header {
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    /* Profile top */
    .profile-top {
      display: flex;
      padding: 15px;
      align-items: center;
    }

    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: url('https://via.placeholder.com/150') center/cover;
      margin-right: 20px;
    }

    .stats {
      flex: 1;
      display: flex;
      justify-content: space-between;
      text-align: center;
    }

    .stats div {
      font-size: 14px;
    }

    .stats strong {
      display: block;
      font-size: 18px;
    }

    /* Bio */
    .bio {
      padding: 0 15px;
      font-size: 14px;
    }

    .bio strong {
      display: block;
      margin-bottom: 4px;
    }

    /* Button */
    .edit-btn {
      margin: 15px;
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      border-bottom: 2px solid black;
      font-weight: bold;
    }

    /* Post Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .grid div {
      background: #ddd;
      height: 120px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">profile</div>

    <div class="profile-top">
      <div class="profile-pic"></div>

      <div class="stats">
        <div>
          <strong>34</strong>
          Posts
        </div>
        <div>
          <strong>1034</strong>
          Followers
        </div>
        <div>
          <strong>168</strong>
          Following
        </div>
      </div>
    </div>

    <div class="bio">
      <strong>Ali</strong>
      Food lover | Chef | Traveler <br>
      Welcome to my dinner table!
    </div>

    <div class="edit-btn">Edit Profile</div>

    <div class="tabs">
      <div class="tab active">Posts</div>
      <div class="tab">Reels</div>
      <div class="tab">Tagged</div>
    </div>

    <div class="grid">
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
    </div>

  </div>

</body>
</html>
