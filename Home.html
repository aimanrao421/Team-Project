<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Screen</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    /* Header */
    header {
      background: #4CAF50;
      color: white;
      padding: 15px 30px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    /* Hero Section */
    .hero {
      padding: 40px 20px;
      text-align: center;
      background: white;
    }

    .hero h1 {
      margin-bottom: 10px;
    }

    .hero p {
      color: #555;
    }

    /* Cards Section */
    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 30px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      width: 250px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #4CAF50;
    }

    .card p {
      font-size: 14px;
      color: #555;
    }

    .card button {
      margin-top: 15px;
      padding: 8px 15px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .card button:hover {
      background: #43a047;
    }

    /* Footer */
    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    My App Home
  </header>

  <section class="hero">
    <h1>Welcome to My Website</h1>
    <p>This is a simple home screen made using HTML & CSS</p>
  </section>

  <section class="cards">
    <div class="card">
      <h3>Services</h3>
      <p>We provide best quality services for our users.</p>
      <button>View</button>
    </div>

    <div class="card">
      <h3>About Us</h3>
      <p>Learn more about our mission and vision.</p>
      <button>Read</button>
    </div>

    <div class="card">
      <h3>Contact</h3>
      <p>Get in touch with us anytime.</p>
      <button>Contact</button>
    </div>
  </section>

  <footer>
    © 2026 My Website
  </footer>

</body>
</html>
